# Build, test and verify Blackbox Receipts on GitLab.
# - verify:live-session records a real session through the MCP proxy on this checkout and checks that the
#   verifier PASSes it and FAILs a secret read, a tampered log and an empty session.
# - verify:attest-diff gates merge requests that carry an agent export on its signed writes.
# - verify:exported-receipts runs when a commit contains receipts/<session>/ exported by the Duo flow,
#   and fails the pipeline unless every exported session verifies.
# - pages publishes the static, read-only site (landing + offline /verify) to GitLab Pages from the
#   default branch. The recorder dashboard and its API are local-only and are not part of it.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [build, test, verify, deploy]

default:
  image: node:22-bookworm
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

build:
  stage: build
  script:
    - pnpm -r build
  artifacts:
    paths:
      - packages/verify/dist
      - packages/receipts/dist
      - packages/proxy/dist
      - packages/meterless/dist
      # apps/web imports @blackbox/zetaris; the test job's typecheck needs its built types.
      - packages/zetaris/dist
    expire_in: 1 day

test:
  stage: test
  needs: [build]
  script:
    - pnpm typecheck
    - pnpm lint
    - pnpm test

verify:live-session:
  stage: verify
  needs: [build]
  script:
    - bash scripts/ci/verify-live-session.sh

verify:agent-demo:
  stage: verify
  needs: [build]
  rules:
    - exists:
        - receipts/agent-demo/*/session.jsonl
  script:
    - bash scripts/ci/verify-agent-demo.sh

verify:exported-receipts:
  stage: verify
  needs: [build]
  rules:
    - exists:
        - receipts/*/session.jsonl
  script:
    # Set BLACKBOX_PUBLIC_KEY (CI/CD variable, PEM) to require that exports were signed by a known proxy key.
    - node packages/proxy/dist/cli.js verify-export

# Receipt-gated merge: on a merge request that carries an agent's exported session
# (receipts/<session>/session.jsonl), every other changed file must be exactly what a signed write_file
# step produced. Results show in the merge request's test report; the signed attestation is an artifact.
# Merge requests without an exported session print NOT APPLICABLE and pass.
# The gate is built and run from the base commit in its own worktree, never from the merge request's
# code, so a request that edits checkDiff, the CLI or attest-diff-pr.sh can't certify itself.
verify:attest-diff:
  stage: verify
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 0
  before_script:
    - corepack enable
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
  script:
    # Set BLACKBOX_PUBLIC_KEY (CI/CD variable, PEM) to pin the proxy key. Unset, the result says UNPINNED.
    - git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - GATE="$(mktemp -d)/gate"
    - git worktree add --detach "$GATE" "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - (cd "$GATE" && pnpm install --frozen-lockfile && pnpm --filter @blackbox/verify build && pnpm --filter @blackbox/receipts build && pnpm --filter @blackbox/meterless build && pnpm --filter @blackbox/proxy build)
    - bash "$GATE/scripts/ci/attest-diff-pr.sh" "$CI_MERGE_REQUEST_DIFF_BASE_SHA" attest-diff
  artifacts:
    when: always
    paths: [attest-diff/]
    reports:
      junit: attest-diff/attest-diff.xml

# GitLab Pages: the landing (the recorded agent run, both exported packs verified in the browser) and the
# offline /verify page, built as a static export by scripts/build-pages.mjs. No server, no API, no keys.
# The base path comes from CI_PAGES_URL, so it works for <namespace>.gitlab.io/<project>/ and for a
# unique-domain site served at the root. Runs on the default branch after the tests pass.
pages:
  stage: deploy
  needs: [test]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - pnpm --filter "@blackbox/web^..." build
    - |
      if [ -n "${CI_PAGES_URL:-}" ]; then
        PAGES_BASE_PATH="$(node -e 'process.stdout.write(new URL(process.env.CI_PAGES_URL).pathname.replace(/\/+$/, ""))')"
      else
        PAGES_BASE_PATH="/$CI_PROJECT_NAME"
      fi
      export PAGES_BASE_PATH
      echo "Pages URL: ${CI_PAGES_URL:-unknown}; base path: '${PAGES_BASE_PATH}'"
    - NEXT_PUBLIC_REPO_URL="$CI_PROJECT_URL" node scripts/build-pages.mjs --out public
    - test -s public/index.html && test -s public/verify/index.html
  artifacts:
    paths: [public]
