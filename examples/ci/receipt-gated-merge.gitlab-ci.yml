# Example for another repo (this repo runs the gate itself: .github/workflows/attest-diff.yml and the
# verify:attest-diff job in .gitlab-ci.yml): the same gate as a GitLab merge request job. JUnit results show
# up in the merge request's test report; the signed attestation is kept as an artifact.
attest-diff:
  image: node:22-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 0
  script:
    - git clone --depth 1 https://github.com/nickthelegend/blackbox-receipts ../blackbox
    - (cd ../blackbox && corepack enable && pnpm install --frozen-lockfile && pnpm --filter @blackbox/verify build && pnpm --filter @blackbox/receipts build && pnpm --filter @blackbox/meterless build && pnpm --filter @blackbox/proxy build)
    # Set BLACKBOX_PUBLIC_KEY (CI/CD variable, PEM) to pin the proxy key.
    - node ../blackbox/packages/proxy/dist/cli.js attest-diff --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --from "$(ls -d receipts/*/ | head -n1)" --junit attest-diff.xml --out attest-diff.json
  artifacts:
    when: always
    paths: [attest-diff.json]
    reports:
      junit: attest-diff.xml
